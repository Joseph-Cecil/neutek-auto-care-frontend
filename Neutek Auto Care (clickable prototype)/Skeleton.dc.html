<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neutek Auto Care page skeletons</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="nt" id="skeleton" style="min-height:0;background:transparent" role="status" aria-busy="true" aria-live="polite">
<span class="sr">Loading</span>

<div class="pagehead" aria-hidden="true"><div class="ttl"><div class="skel" style="width:220px;height:28px"></div><div class="skel line" style="width:340px;margin-top:8px"></div></div><div class="skel btnk"></div></div>

<sc-if value="{{kind.list}}" hint-placeholder-val="{{ true }}">
<div class="stack" aria-hidden="true">
  <div class="card"><div class="filters"><div class="skel inputk"></div><div class="skel inputk"></div><div class="skel inputk"></div><div class="skel inputk"></div></div></div>
  <div class="card flush">
    <div class="skrow" style="background:var(--bg-tertiary);padding:12px 24px"><div class="skel line" style="width:60%"></div><div class="skel line" style="width:50%"></div><div class="skel line" style="width:40%"></div><div class="skel line" style="width:50%"></div></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><div class="skrow"><div><div class="skel line" style="width:70%"></div><div class="skel line" style="width:45%;margin-top:8px;height:10px"></div></div><div class="skel line" style="width:60%"></div><div class="skel line" style="width:50%"></div><div><span class="skel pillk" style="display:block"></span></div></div></sc-for>
  </div>
</div>
</sc-if>

<sc-if value="{{kind.dash}}" hint-placeholder-val="{{ false }}">
<div class="stack" aria-hidden="true">
  <div class="card"><div class="sumcard"><div><div class="skel line" style="width:60%"></div><div class="skel" style="width:70%;height:30px;margin-top:10px"></div></div><div><div class="skel line" style="width:50%"></div><div class="skel" style="width:40%;height:30px;margin-top:10px"></div></div><div><div class="skel line" style="width:55%"></div><div class="skel" style="width:40%;height:30px;margin-top:10px"></div></div><div><div class="skel line" style="width:45%"></div><div class="skel" style="width:50%;height:30px;margin-top:10px"></div></div></div></div>
  <div class="grid g2">
    <div class="card flush"><div style="padding:20px 24px 8px"><div class="skel" style="width:150px;height:20px"></div></div><sc-for list="{{rows3}}" as="r" hint-placeholder-count="3"><div class="skrow"><div><div class="skel line" style="width:60%"></div></div><div class="skel line" style="width:30%"></div></div></sc-for></div>
    <div class="card flush"><div style="padding:20px 24px 8px"><div class="skel" style="width:170px;height:20px"></div></div><sc-for list="{{rows3}}" as="r" hint-placeholder-count="3"><div class="skrow"><div><div class="skel line" style="width:70%"></div></div><div class="skel line" style="width:30%"></div></div></sc-for></div>
  </div>
</div>
</sc-if>

<sc-if value="{{kind.detail}}" hint-placeholder-val="{{ false }}">
<div class="stack" aria-hidden="true">
  <div class="grid g2">
    <div class="card"><div class="skel" style="width:180px;height:20px;margin-bottom:20px"></div><sc-for list="{{rows5}}" as="r" hint-placeholder-count="5"><div class="row sb" style="margin-bottom:14px"><div class="skel line" style="width:80px"></div><div class="skel line" style="width:160px"></div></div></sc-for></div>
    <div class="card"><div class="skel" style="width:200px;height:20px;margin-bottom:20px"></div><div class="skel line" style="width:100%;margin-bottom:12px"></div><div class="skel line" style="width:90%;margin-bottom:12px"></div><div class="skel line" style="width:70%"></div></div>
  </div>
  <div class="card flush"><div style="padding:20px 24px 8px"><div class="skel" style="width:160px;height:20px"></div></div><sc-for list="{{rows3}}" as="r" hint-placeholder-count="3"><div class="skrow"><div class="skel line" style="width:50%"></div><div class="skel line" style="width:30%"></div><div class="skel line" style="width:40%"></div></div></sc-for></div>
</div>
</sc-if>

<sc-if value="{{kind.form}}" hint-placeholder-val="{{ false }}">
<div class="card stack" aria-hidden="true">
  <div class="skel" style="width:140px;height:18px"></div>
  <div class="grid g2"><div><div class="skel line" style="width:80px;margin-bottom:8px"></div><div class="skel inputk"></div></div><div><div class="skel line" style="width:100px;margin-bottom:8px"></div><div class="skel inputk"></div></div></div>
  <div><div class="skel line" style="width:90px;margin-bottom:8px"></div><div class="skel" style="height:96px;border-radius:var(--r2)"></div></div>
  <div class="row end"><div class="skel btnk"></div><div class="skel btnk"></div></div>
</div>
</sc-if>

<sc-if value="{{kind.cards}}" hint-placeholder-val="{{ false }}">
<div class="grid g2" aria-hidden="true">
  <sc-for list="{{rows4}}" as="r" hint-placeholder-count="4"><div class="card"><div class="skel" style="width:170px;height:20px;margin-bottom:16px"></div><div class="skel line" style="width:80%;margin-bottom:12px"></div><div class="skel line" style="width:55%;margin-bottom:16px"></div><div class="skel btnk" style="width:100px;height:32px"></div></div></sc-for>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"kind":{"editor":"enum","default":"list","options":["list","dash","detail","form","cards"]},"$preview":{"width":1100,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    var app = this.props.app, k = (app && app.skelKind) || this.props.kind || 'list';
    var mk = function (n) { var a = []; for (var i = 0; i < n; i++) a.push({ i: i }); return a; };
    return { kind: { list: k === 'list', dash: k === 'dash', detail: k === 'detail', form: k === 'form', cards: k === 'cards' }, rows: mk(6), rows3: mk(3), rows4: mk(4), rows5: mk(5) };
  }
}
</script>
</body>
</html>
